name: Temporis CI

on:
  push:
    branches: [ "develop", "develop-testing-tofix", "sonar-testing", "main" ]
  pull_request:
    branches: [ "develop", "develop-testing-tofix", "sonar-testing", "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Tests and Generate Coverage
      # CORREGIDO: Eliminamos el --continue para asegurar que el reporte Jacoco solo se compile si la suite es exitosa.
      # Añadimos variables de entorno para que Robolectric corra de forma óptima en el servidor de GitHub.
      env:
        ROBOLECTRIC_OFFLINE: false
      run: ./gradlew clean :app:testDebugUnitTest :app:testDebugUnitTestCoverageReport --no-daemon

    - name: SonarQube Scan
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      # CORREGIDO: Pasamos de manera explícita la clave del proyecto para evitar desajustes en el scanner de SonarCloud
      run: ./gradlew sonar -Dsonar.projectKey=kevinzamoraa_Temporis-Final_Project-DAM --info --no-daemon
        
    - name: Upload Test Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: app/build/reports/jacoco/

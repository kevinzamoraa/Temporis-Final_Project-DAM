name: Temporis CI
on:
  push:
    branches: [ "develop", "develop-testing-tofix", "main" ]
  pull_request:
    branches: [ "develop", "develop-testing-tofix", "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Tests and Generate Coverage
      # Forzamos la creación del reporte antes que nada
      run: ./gradlew testDebugUnitTest testDebugUnitTestCoverageReport --stacktrace

    - name: Verify Coverage Report Existence
      # Este paso es solo para depurar en el log de GitHub si el archivo se creó
      run: ls -R app/build/reports/jacoco/ || echo "No se encontró la carpeta de reportes"

    - name: SonarQube Scan
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      # Ejecutamos sonar de forma independiente para asegurar que los archivos ya existen
      run: ./gradlew sonar --info

    - name: Upload Test Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: app/build/reports/jacoco/testDebugUnitTestCoverageReport/

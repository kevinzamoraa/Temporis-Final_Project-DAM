name: Temporis CI
on:
  push:
    branches: [ "develop", "develop-testing-tofix", "main" ]
  pull_request:
    branches: [ "develop", "develop-testing-tofix", "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Tests and Generate Coverage
      run: ./gradlew :app:testDebugUnitTest :app:testDebugUnitTestCoverageReport --continue

    - name: Debug - List Coverage Files
      # Buscamos en todo el proyecto para estar 100% seguros
      run: find . -name "report.xml"

    - name: SonarQube Scan
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: ./gradlew :app:sonar --info

    - name: Upload Test Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: app/build/reports/jacoco/testDebugUnitTestCoverageReport/

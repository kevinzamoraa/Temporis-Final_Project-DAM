name: Temporis CI
on:
  push:
    branches: [ "develop", "develop-testing-tofix", "main" ]
  pull_request:
    branches: [ "develop", "develop-testing-tofix", "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Tests and Generate Coverage
      # Añadimos :app: delante de las tareas para ser explícitos
      run: ./gradlew clean :app:testDebugUnitTest :app:testDebugUnitTestCoverageReport --continue

    - name: SonarQube Scan
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      # Ejecutamos el sonar raíz pero le decimos explícitamente que el proyecto está en :app
      run: |
        ./gradlew sonar \
          -Dsonar.projectKey=kevinzamoraa_Temporis-Final_Project-DAM \
          -Dsonar.organization=kevinzamoraa \
          -Dsonar.modules=:app \
          --info --stacktrace

    - name: Upload Test Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        # Subimos toda la carpeta de reportes para que se pueda inspeccionar, si falla
        path: app/build/reports/jacoco/

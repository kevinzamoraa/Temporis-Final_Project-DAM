name: Temporis CI
on:
  push:
    branches: [ "develop", "develop-testing-tofix", "sonar-testing", "main" ]
  pull_request:
    branches: [ "develop", "develop-testing-tofix", "sonar-testing", "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Importante para que Sonar vea el historial de ramas

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Tests and Generate Coverage
      # Eliminamos el clean momentáneamente para ver si los archivos persisten
      run: ./gradlew :app:testDebugUnitTest :app:testDebugUnitTestCoverageReport --info

    - name: Debug - List All Files
      # Esto nos dirá si la carpeta de reportes realmente se crea
      run: |
        ls -R app/build/reports || echo "No existe la carpeta de reportes"

    - name: SonarQube Scan
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        ./gradlew :app:sonar \
          -Dsonar.projectKey=kevinzamoraa_Temporis-Final_Project-DAM \
          -Dsonar.organization=kevinzamoraa \
          -Dsonar.coverage.jacoco.xmlReportPaths=app/build/reports/jacoco/testDebugUnitTestCoverageReport/testDebugUnitTestCoverageReport.xml \
          --info

    - name: Upload Test Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: app/build/reports/jacoco/

name: Temporis CI
on:
  push:
    branches: [ "develop", "develop-testing-tofix", "sonar-testing", "main" ]
  pull_request:
    branches: [ "develop", "develop-testing-tofix", "sonar-testing", "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Tests and Generate Coverage
      # Importante: mantenemos el clean para asegurar que el reporte sea fresco
      run: ./gradlew clean :app:testDebugUnitTest :app:testDebugUnitTestCoverageReport --info

    - name: SonarQube Scan
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        # 1. Buscamos el archivo XML dinámicamente en todo el proyecto
        REPORT_PATH=$(find . -name "testDebugUnitTestCoverageReport.xml" | head -n 1)
        
        echo "-------------------------------------------------------"
        if [ -z "$REPORT_PATH" ]; then
          echo "AVISO: No se encontró el archivo XML de JaCoCo."
          echo "Ejecutando Sonar sin datos de cobertura para evitar fallos de instanciación."
          ./gradlew :app:sonar \
            -Dsonar.projectKey=kevinzamoraa_Temporis-Final_Project-DAM \
            -Dsonar.organization=kevinzamoraa \
            --info
        else
          echo "REPORTE LOCALIZADO EN: $REPORT_PATH"
          echo "Enviando datos a SonarCloud..."
          ./gradlew :app:sonar \
            -Dsonar.projectKey=kevinzamoraa_Temporis-Final_Project-DAM \
            -Dsonar.organization=kevinzamoraa \
            -Dsonar.coverage.jacoco.xmlReportPaths=$REPORT_PATH \
            --info
        fi
        echo "-------------------------------------------------------"

    - name: Upload Test Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        # Subimos todos los reportes encontrados para debug
        path: "**/build/reports/jacoco/"

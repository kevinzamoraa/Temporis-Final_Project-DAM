name: Temporis CI

on:
  push:
    branches: [ "develop", "develop-testing-tofix", "sonar-testing", "main" ]
  pull_request:
    branches: [ "develop", "develop-testing-tofix", "sonar-testing", "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Tests, Generate Coverage and SonarQube Scan
      # CORREGIDO: Separamos físicamente las ejecuciones con un salto de línea multilinea (using |)
      # El primer comando limpia, corre los 85 tests y escribe el XML de JaCoCo.
      # El segundo comando levanta el escáner de SonarCloud leyendo el archivo ya creado con total seguridad.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        ROBOLECTRIC_OFFLINE: false
      run: |
        ./gradlew clean :app:testDebugUnitTest :app:testDebugUnitTestCoverageReport --no-daemon
        ./gradlew :app:sonar -Dsonar.projectKey=kevinzamoraa_Temporis-Final_Project-DAM --info --no-daemon

    - name: Upload Test Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: app/build/reports/jacoco/

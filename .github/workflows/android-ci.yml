name: Temporis CI

on:
  push:
    branches: [ "develop", "develop-testing-tofix", "sonar-testing", "main" ]
  pull_request:
    branches: [ "develop", "develop-testing-tofix", "sonar-testing", "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Tests, Generate Coverage and SonarQube Scan
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        ROBOLECTRIC_OFFLINE: false
      run: |
        ./gradlew clean :app:testDebugUnitTest :app:testDebugUnitTestCoverageReport :app:sonar \
          -Dsonar.projectKey=kevinzamoraa_Temporis-Final_Project-DAM \
          -Dsonar.organization=kevinzamoraa \
          -Dsonar.host.url=https://sonarcloud.io \
          -Dsonar.coverage.jacoco.xmlReportPaths=app/build/reports/jacoco/testDebugUnitTestCoverageReport/testDebugUnitTestCoverageReport.xml \
          -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
          -Dsonar.gradle.skipCompile=true \
          --no-daemon
    
    - name: Upload Test Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: app/build/reports/jacoco/

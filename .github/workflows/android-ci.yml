name: Temporis CI
on:
  push:
    branches: [ "develop", "develop-testing-tofix", "main" ]
  pull_request:
    branches: [ "develop", "develop-testing-tofix", "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Tests and Generate Coverage
      # Añadimos clean para asegurar que no haya basura de builds previos
      run: ./gradlew clean :app:testDebugUnitTest :app:testDebugUnitTestCoverageReport --continue

    - name: Debug - Locate Coverage Report
      # Este comando es clave: busca cualquier XML en la carpeta de reportes y lo muestra
      run: |
        echo "Buscando reportes XML de Jacoco..."
        find . -path "*/build/reports/jacoco/**/*.xml"

    - name: SonarQube Scan
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      # Ejecutamos sonar. Si el archivo XML existe en app/build/reports/jacoco/... lo encontrará
      run: ./gradlew :app:sonar --info

    - name: Upload Test Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        # Subimos toda la carpeta de reportes para que se pueda inspeccionar, si falla
        path: app/build/reports/jacoco/
